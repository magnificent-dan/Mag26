backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - file: "data/header.json"
        label: "Header & Brand Colors"
        name: "header"
        fields:
          - {label: "Brand Name", name: "brandName", widget: "string"}
          - {label: "Role / Tagline (under name)", name: "brandRole", widget: "string"}
          - {label: "Primary Color", name: "primaryColor", widget: "color"}
          - {label: "Secondary Color", name: "secondaryColor", widget: "color"}

      - file: "data/hero.json"
        label: "Hero (\"Design your business deserves\")"
        name: "hero"
        fields:
          - {label: "Eyebrow (small line above headline)", name: "eyebrow", widget: "string"}
          - {label: "Headline — Main Part", name: "headlinePrefix", widget: "string"}
          - {label: "Headline — Emphasized Part (colored)", name: "headlineEmphasis", widget: "string"}
          - {label: "Subtext", name: "lede", widget: "text"}
          - {label: "Primary Button Text", name: "ctaPrimaryText", widget: "string"}
          - {label: "Secondary Button Text", name: "ctaGhostText", widget: "string"}

      - file: "data/trust.json"
        label: "Recently Designed For"
        name: "trust"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - label: "Client Names"
            name: "names"
            widget: "list"
            field: {label: "Name", name: "name", widget: "string"}

      - file: "data/about.json"
        label: "About"
        name: "about"
        fields:
          - {label: "Eyebrow", name: "eyebrow", widget: "string"}
          - {label: "Heading", name: "heading", widget: "string"}
          - label: "Paragraphs"
            name: "paragraphs"
            widget: "list"
            field: {label: "Paragraph", name: "paragraph", widget: "text"}
          - label: "Fact Cards"
            name: "stats"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "sub", widget: "string"}

      - file: "data/platforms.json"
        label: "Find Me On"
        name: "platforms"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - label: "Platforms"
            name: "platforms"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Platform Name", name: "name", widget: "string"}
              - {label: "Profile URL", name: "url", widget: "string"}
              - {label: "Icon slug (simpleicons.org name, leave blank for text badge)", name: "icon", widget: "string", required: false}
              - {label: "Icon Color (hex, no #)", name: "iconColor", widget: "string", required: false}
              - {label: "Badge Text (used only if no icon)", name: "badgeText", widget: "string", required: false}

      - file: "data/services.json"
        label: "Services (\"What I can do for your brand\")"
        name: "services"
        fields:
          - {label: "Eyebrow", name: "eyebrow", widget: "string"}
          - {label: "Heading", name: "heading", widget: "string"}
          - label: "Tiers"
            name: "tiers"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - {label: "Tier Label (e.g. Starter)", name: "label", widget: "string"}
              - {label: "Tier Title", name: "title", widget: "string"}
              - {label: "Highlight this tier?", name: "highlighted", widget: "boolean", default: false}
              - label: "Bullets"
                name: "bullets"
                widget: "list"
                field: {label: "Bullet", name: "bullet", widget: "string"}
          - {label: "\"Well Suited For\" Label", name: "fitsLabel", widget: "string"}
          - label: "\"Well Suited For\" Tags"
            name: "fitsTags"
            widget: "list"
            field: {label: "Tag", name: "tag", widget: "string"}

      - file: "data/more-projects.json"
        label: "More Projects (external Behance links)"
        name: "moreProjects"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Category Label", name: "category", widget: "string"}
              - {label: "Project Title", name: "title", widget: "string"}
              - {label: "Link URL", name: "url", widget: "string"}

  - name: "brands"
    label: "Brands / Client Work"
    files:
      - file: "data/brands.json"
        label: "Client Work"
        name: "brands_file"
        fields:
          - label: "Brands"
            name: "brands"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Brand / Client Name", name: "name", widget: "string"}
              - {label: "Short Description", name: "description", widget: "text"}
              - label: "Swatch Colors"
                name: "swatch"
                widget: "list"
                field: {label: "Hex Color", name: "color", widget: "color"}
              - label: "Projects"
                name: "projects"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Image Alt Text", name: "alt", widget: "string"}
                  - {label: "Category Label (e.g. SOCIAL DESIGN)", name: "category", widget: "string"}
                  - {label: "Project Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - label: "Tags"
                    name: "tags"
                    widget: "list"
                    field: {label: "Tag", name: "tag", widget: "string"}
